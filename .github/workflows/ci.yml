name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm build
      - name: Verify build invariants
        run: |
          set -euo pipefail
          test -f dist/index.html
          # The portal declares its own canonical origin.
          grep -q 'rel="canonical" href="https://aixmath.org/' dist/index.html
          # The navigation must keep pointing at the news site.
          grep -q 'news\.aixmath\.org' dist/index.html
